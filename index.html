<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi Administrasi Internal Event</title>

<!-- Local branding assets -->
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="shortcut icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --sidebar:#111827;
  --bg:#f3f6fa;
  --card:#fff;
  --text:#172033;
  --muted:#6b7280;
  --border:#e5e7eb;
  --success:#16a34a;
  --warning:#d97706;
  --danger:#dc2626;
  --shadow:0 8px 28px rgba(15,23,42,.07);
  --radius:14px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{overflow-x:hidden}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ================= LOGIN ================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top right,rgba(37,99,235,.18),transparent 35%),
    radial-gradient(circle at bottom left,rgba(59,130,246,.10),transparent 30%),
    #f3f6fa;
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:0 20px 60px rgba(15,23,42,.12);
  padding:34px;
}

.login-logo{
  width:76px;
  height:76px;
  object-fit:contain;
  display:block;
  margin:0 auto 18px;
}

.logo-fallback{
  width:76px;
  height:76px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--primary);
  color:#fff;
  font-size:28px;
  font-weight:800;
  margin:0 auto 18px;
}

.login-title{
  text-align:center;
  font-size:24px;
  font-weight:800;
  margin-bottom:7px;
}

.login-subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
}

.form-group{margin-bottom:16px}

.form-label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.input-wrap{position:relative}

.form-control{
  width:100%;
  min-height:44px;
  padding:11px 13px;
  border:1px solid #d7dce3;
  border-radius:10px;
  outline:none;
  background:#fff;
  color:var(--text);
  transition:.2s;
}

.form-control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.password-input{padding-right:48px}

.password-toggle{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  width:36px;
  height:36px;
  border-radius:8px;
  color:#6b7280;
}

.password-toggle:hover{background:#f3f4f6}

.login-error{
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca;
  border-radius:9px;
  padding:10px 12px;
  font-size:13px;
  margin-bottom:14px;
}

/* ================= BUTTON ================= */

.btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  min-height:40px;
  font-weight:700;
  transition:.18s;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{background:var(--primary-dark)}

.btn-secondary{
  background:#eef2f7;
  color:#374151;
}

.btn-secondary:hover{background:#e5eaf0}

.btn-success{
  background:var(--success);
  color:#fff;
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

.btn-warning{
  background:var(--warning);
  color:#fff;
}

.btn-block{width:100%}

.btn-sm{
  min-height:32px;
  padding:7px 9px;
  font-size:11px;
  border-radius:7px;
}

/* ================= APP ================= */

#app{min-height:100vh}

.app-shell{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:250px;
  background:linear-gradient(180deg,var(--sidebar),#0d1420);
  color:#fff;
  position:fixed;
  inset:0 auto 0 0;
  z-index:100;
  transition:.25s;
  overflow-y:auto;
}

.sidebar-brand{
  padding:20px 18px;
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  gap:12px;
}

.sidebar-logo{
  width:40px;
  height:40px;
  object-fit:contain;
  border-radius:10px;
  background:#fff;
  padding:4px;
}

.sidebar-logo-fallback{
  width:40px;
  height:40px;
  border-radius:10px;
  background:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.brand-text{min-width:0}

.brand-title{
  font-size:14px;
  font-weight:800;
}

.brand-subtitle{
  font-size:11px;
  color:#9ca3af;
  margin-top:2px;
}

.nav{padding:15px 10px}

.nav-section{
  padding:9px 10px 7px;
  color:#6b7280;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:800;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:11px 12px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:3px;
  font-size:13px;
  font-weight:600;
}

.nav-item:hover{
  background:rgba(255,255,255,.06);
  color:#fff;
}

.nav-item.active{
  background:#2563eb;
  color:#fff;
}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:15px;
}

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-width:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:70px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.mobile-menu{
  display:none;
  border:0;
  background:#eef2f7;
  width:40px;
  height:40px;
  border-radius:9px;
}

.page-title{
  font-size:18px;
  font-weight:800;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.loading-wrap{
  width:150px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:#64748b;
}

.loading-bar{
  height:5px;
  background:#e5e7eb;
  border-radius:99px;
  flex:1;
  overflow:hidden;
}

.loading-progress{
  width:0%;
  height:100%;
  background:var(--primary);
  transition:.2s;
}

.loading-percent{
  min-width:31px;
  text-align:right;
  font-weight:700;
}

.user-chip{
  display:flex;
  align-items:center;
  gap:9px;
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:11px;
  padding:7px 10px;
}

.user-avatar{
  width:34px;
  height:34px;
  background:var(--primary);
  color:#fff;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:13px;
}

.user-name{
  font-size:12px;
  font-weight:800;
}

.user-role{
  color:#6b7280;
  font-size:10px;
  margin-top:2px;
}

.content{padding:25px}

/* ================= CARDS ================= */

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card-header{
  padding:17px 19px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.card-title{
  font-size:15px;
  font-weight:800;
}

.card-body{padding:19px}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:20px;
}

.page-head h1{
  font-size:23px;
  margin:0 0 5px;
}

.page-head p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.page-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* ================= DASHBOARD ================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:20px;
}

.stat-card{
  padding:18px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:#6b7280;
  font-size:12px;
  font-weight:700;
}

.stat-value{
  font-size:27px;
  font-weight:800;
  margin-top:7px;
}

.stat-note{
  font-size:11px;
  color:#94a3b8;
  margin-top:5px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:18px;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.data-table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

.data-table th{
  background:#f8fafc;
  color:#475569;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.025em;
  font-weight:800;
  padding:11px 12px;
  border-bottom:1px solid var(--border);
  text-align:left;
  white-space:nowrap;
}

.data-table td{
  padding:11px 12px;
  border-bottom:1px solid #edf0f3;
  font-size:12px;
  vertical-align:middle;
}

.data-table tr:hover td{background:#fbfdff}

.empty-state{
  text-align:center;
  padding:35px 15px;
  color:#94a3b8;
  font-size:13px;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:nowrap;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.badge-success{
  color:#166534;
  background:#dcfce7;
}

.badge-warning{
  color:#92400e;
  background:#fef3c7;
}

.badge-danger{
  color:#991b1b;
  background:#fee2e2;
}

.badge-info{
  color:#1e40af;
  background:#dbeafe;
}

.badge-gray{
  color:#475569;
  background:#e2e8f0;
}

/* ================= FORMS ================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.form-group-full{grid-column:1/-1}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--border);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:720px;
  max-height:92vh;
  overflow-y:auto;
  background:#fff;
  border-radius:16px;
  box-shadow:0 25px 80px rgba(0,0,0,.2);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:17px 20px;
  border-bottom:1px solid var(--border);
}

.modal-title{
  font-weight:800;
  font-size:16px;
}

.modal-close{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:#f1f5f9;
  color:#475569;
  font-size:20px;
}

.modal-body{padding:20px}

/* ================= INVOICE ================= */

.invoice-items{
  border:1px solid var(--border);
  border-radius:11px;
  overflow:hidden;
}

.invoice-item-head,
.invoice-item-row{
  display:grid;
  grid-template-columns:minmax(180px,1fr) 90px 140px 42px;
  gap:8px;
  padding:9px;
  align-items:center;
}

.invoice-item-head{
  background:#f8fafc;
  font-size:10px;
  font-weight:800;
  color:#64748b;
  text-transform:uppercase;
}

.invoice-item-row{
  border-top:1px solid var(--border);
}

.invoice-total{
  display:flex;
  justify-content:flex-end;
  gap:20px;
  align-items:center;
  margin-top:13px;
  font-weight:800;
}

.invoice-total-value{
  font-size:18px;
  color:var(--primary);
}

.item-remove{
  border:0;
  background:#fee2e2;
  color:#dc2626;
  width:32px;
  height:32px;
  border-radius:7px;
}

/* ================= PERMISSIONS ================= */

.permission-table{min-width:900px}

.permission-check{
  width:17px;
  height:17px;
}

/* ================= TOAST ================= */

#toastContainer{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:260px;
  max-width:390px;
  background:#fff;
  border:1px solid var(--border);
  border-left:4px solid var(--primary);
  box-shadow:0 10px 30px rgba(15,23,42,.14);
  padding:12px 14px;
  border-radius:9px;
  font-size:12px;
  animation:toastIn .2s ease;
}

.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= WELCOME ================= */

#welcomeOverlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.72);
  backdrop-filter:blur(5px);
  z-index:900;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#welcomeOverlay.show{display:flex}

.welcome-box{
  width:100%;
  max-width:450px;
  background:#fff;
  border-radius:22px;
  padding:35px 30px;
  text-align:center;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
}

.welcome-icon{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  background:#dbeafe;
  color:#2563eb;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.welcome-box h2{margin:0 0 8px}

.welcome-box p{
  color:#64748b;
  font-size:13px;
  margin:0 0 22px;
}

/* ================= LOADING ================= */

.global-loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(2px);
  z-index:800;
  display:none;
  align-items:center;
  justify-content:center;
}

.global-loading.show{display:flex}

.loading-card{
  background:#fff;
  border:1px solid var(--border);
  box-shadow:0 15px 50px rgba(15,23,42,.12);
  padding:20px 25px;
  border-radius:14px;
  min-width:260px;
  text-align:center;
}

.spinner{
  width:32px;
  height:32px;
  border:3px solid #dbeafe;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loading-text{
  font-size:12px;
  color:#64748b;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

  .stats-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:850px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .user-chip .user-name,
  .user-chip .user-role{
    display:none;
  }

  .content{padding:17px}

  .topbar{padding:0 15px}

}

@media(max-width:650px){

  .stats-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{padding:14px}

  .stat-value{font-size:22px}

  .page-head{
    flex-direction:column;
  }

  .page-actions{
    width:100%;
  }

  .page-actions .btn{
    flex:1;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group-full{
    grid-column:auto;
  }

  .card-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .login-card{
    padding:25px 20px;
  }

  .invoice-item-head{
    display:none;
  }

  .invoice-item-row{
    grid-template-columns:1fr 80px;
    padding:12px;
  }

  .invoice-item-row .price-input{
    grid-column:1;
  }

  .invoice-item-row .item-remove{
    grid-column:2;
    grid-row:1 / span 2;
    justify-self:end;
  }

  .loading-wrap{display:none}

}
</style>
</head>

<body>

<!--
  LOCAL LOGO STRUCTURE
  Aplikasi Administrasi Internal Event.html
  assets/logo.png

  Favicon, logo login, dan logo sidebar semuanya menggunakan
  file lokal assets/logo.png (tanpa URL eksternal).
-->

<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginPage">

  <div class="login-card">

    <img
      src="assets/logo.png"
      class="login-logo"
      alt="Logo Aplikasi"
      loading="eager"
      id="loginLogo"
      onerror="
        this.style.display='none';
        document.getElementById('loginLogoFallback').style.display='flex';
      "
    >

    <div
      id="loginLogoFallback"
      class="logo-fallback"
      style="display:none"
    >
      MN
    </div>

    <div class="login-title">
      Administrasi Internal Event
    </div>

    <div class="login-subtitle">
      Silakan login untuk melanjutkan
    </div>

    <div
      id="loginError"
      class="login-error hidden"
    ></div>

    <form id="loginForm">

      <div class="form-group">

        <label class="form-label">
          Username
        </label>

        <input
          id="loginUsername"
          class="form-control"
          type="text"
          autocomplete="username"
          placeholder="Masukkan username"
          required
        >

      </div>

      <div class="form-group">

        <label class="form-label">
          Password
        </label>

        <div class="input-wrap">

          <input
            id="loginPassword"
            class="form-control password-input"
            type="password"
            autocomplete="current-password"
            placeholder="Masukkan password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="togglePassword"
          >
            👁
          </button>

        </div>

      </div>

      <button
        id="loginButton"
        class="btn btn-primary btn-block"
        type="submit"
      >
        Login
      </button>

    </form>

  </div>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="hidden">

  <div class="app-shell">

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-brand">

        <img
          src="assets/logo.png"
          class="sidebar-logo"
          alt="Logo Aplikasi"
          loading="eager"
          id="sidebarLogo"
          onerror="
            this.style.display='none';
            document.getElementById('sidebarLogoFallback').style.display='flex';
          "
        >

        <div
          id="sidebarLogoFallback"
          class="sidebar-logo-fallback"
          style="display:none"
        >
          MN
        </div>

        <div class="brand-text">

          <div class="brand-title">
            Administrasi Event
          </div>

          <div class="brand-subtitle">
            Internal Management
          </div>

        </div>

      </div>


      <nav class="nav">

        <div class="nav-section">
          Menu Utama
        </div>

        <button
          class="nav-item"
          data-page="dashboard"
          data-menu="Dashboard"
        >
          <span class="nav-icon">▦</span>
          Dashboard
        </button>

        <button
          class="nav-item"
          data-page="event"
          data-menu="Event"
        >
          <span class="nav-icon">📅</span>
          Event
        </button>

        <button
          class="nav-item"
          data-page="vendor"
          data-menu="Vendor"
        >

function escapeHtml(value){

  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value == null ? "" : value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


function formatRupiah(value){

  return "Rp " +
    Number(value || 0)
      .toLocaleString("id-ID");

}


function formatDate(value){

  if(!value) return "-";

  const s = String(value);

  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){

    const p = s.split("-");

    return p[2] + "/" +
      p[1] + "/" +
      p[0];

  }

  return s;

}


function initials(name){

  const parts =
    String(name || "User")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(!parts.length)
    return "U";

  if(parts.length === 1)
    return parts[0]
      .substring(0,2)
      .toUpperCase();

  return (
    parts[0][0] +
    parts[parts.length-1][0]
  ).toUpperCase();

}

const CLIENT_CACHE_PREFIX = "eventAdminFast2_";
const CLIENT_CACHE_TTL = 5 * 60 * 1000;
let lastDataSyncAt = 0;

function userCachePrefix(){
  return CLIENT_CACHE_PREFIX + String(state.user?.username || "guest") + "_";
}

function menuCacheKey(menu){
  return userCachePrefix() + "menu_" + String(menu);
}

function dashboardCacheKey(){
  return userCachePrefix() + "dashboard";
}

function saveMenuCache(menu,data){
  try{
    localStorage.setItem(menuCacheKey(menu),JSON.stringify({
      savedAt:Date.now(),
      data:data || []
    }));
  }catch(e){
    // localStorage penuh: hapus cache lama menu ini saja.
    try{ localStorage.removeItem(menuCacheKey(menu)); }catch(ignore){}
  }
}

function readMenuCache(menu){
  try{
    const raw=localStorage.getItem(menuCacheKey(menu));
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(!obj || !Array.isArray(obj.data)) return null;
    return obj;
  }catch(e){ return null; }
}

function saveDashboardCache(data){
  try{
    localStorage.setItem(dashboardCacheKey(),JSON.stringify({
      savedAt:Date.now(),data:data || {}
    }));
  }catch(e){}
}

function readDashboardCache(){
  try{
    const raw=localStorage.getItem(dashboardCacheKey());
    if(!raw) return null;
    const obj=JSON.parse(raw);
    return obj && obj.data ? obj : null;
  }catch(e){ return null; }
}

function saveClientCache(){
  // FAST 2.0 menyimpan cache per menu, bukan satu JSON besar.
  Object.keys(state.data || {}).forEach(menu=>{
    if(Array.isArray(state.data[menu])) saveMenuCache(menu,state.data[menu]);
  });
  if(state.dashboard) saveDashboardCache(state.dashboard);
}

function readClientCache(){
  const result={data:{},dashboard:null,savedAt:0};
  Object.keys(PAGE_DATA_MAP).forEach(menu=>{
    const c=readMenuCache(menu);
    if(c){
      result.data[menu]=c.data;
      result.savedAt=Math.max(result.savedAt,Number(c.savedAt||0));
    }
  });
  const d=readDashboardCache();
  if(d){ result.dashboard=d.data; result.savedAt=Math.max(result.savedAt,Number(d.savedAt||0)); }
  return result.savedAt ? result : null;
}

function clearClientCache(){
  try{
    const prefix=userCachePrefix();
    for(let i=localStorage.length-1;i>=0;i--){
      const key=localStorage.key(i);
      if(key && key.indexOf(prefix)===0) localStorage.removeItem(key);
    }
  }catch(e){}
}

function applyBootstrap(result){
  if(!result || !result.ok) return;
  state.permissions=result.permissions || {};
  if(result.userRole) state.user.role=result.userRole;
  localStorage.setItem("eventAdminUser",JSON.stringify(state.user));
  updateUserUI();
  applyPermissions();
}

function applyMenuResult(result){
  if(!result || !result.ok) return;
  const data=result.data || {};
  Object.keys(data).forEach(menu=>{
    state.data[menu]=Array.isArray(data[menu]) ? data[menu] : [];
    state.loadedMenus[menu]=Date.now();
    saveMenuCache(menu,state.data[menu]);
  });
  lastDataSyncAt=Date.now();
}

function applyDashboardResult(result){
  if(!result || !result.ok) return;
  state.dashboard=result.data || {};
  saveDashboardCache(state.dashboard);
  lastDataSyncAt=Date.now();
}

function updateLocalRow(sheet,keyField,keyValue,row){
  if(!state.data[sheet]) state.data[sheet]=[];
  const rows=state.data[sheet];
  const index=rows.findIndex(r=>String(r[keyField]||"")===String(keyValue||""));
  if(index>=0) rows[index]={...rows[index],...row};
  else rows.unshift(row);
  saveMenuCache(sheet,rows);
  state.loadedMenus[sheet]=Date.now();
}

function removeLocalRow(sheet,keyField,keyValue){
  if(!state.data[sheet]) return;
  state.data[sheet]=state.data[sheet].filter(r=>String(r[keyField]||"")!==String(keyValue||""));
  saveMenuCache(sheet,state.data[sheet]);
}

function applyMutationResult(action,result,payload){
  if(!result || !result.ok) return;
  const map={
    saveEvent:["Event","ID Event"],updateEvent:["Event","ID Event"],
    saveVendor:["Vendor","ID Vendor"],updateVendor:["Vendor","ID Vendor"],
    savePerlengkapan:["Perlengkapan","ID Item"],updatePerlengkapan:["Perlengkapan","ID Item"],
    saveInvoice:["Invoice","No Invoice"],updateInvoice:["Invoice","No Invoice"],
    savePembayaran:["Pembayaran","ID Bayar"],updatePembayaran:["Pembayaran","ID Bayar"],
    saveCashflow:["Cashflow","ID Cashflow"],updateCashflow:["Cashflow","ID Cashflow"]
  };
  const meta=map[action];
  if(meta && result.data) updateLocalRow(meta[0],meta[1],result.data[meta[1]],result.data);
  const delMap={
    deleteEvent:["Event","ID Event"],deleteVendor:["Vendor","ID Vendor"],
    deletePerlengkapan:["Perlengkapan","ID Item"],deleteInvoice:["Invoice","No Invoice"],
    deletePembayaran:["Pembayaran","ID Bayar"],deleteCashflow:["Cashflow","ID Cashflow"]
  };
  const del=delMap[action];
  if(del) removeLocalRow(del[0],del[1],payload?.id);

}

function hasFreshMenu(menu){

}

async function ensureMenuData(page,{silent=false,force=false}={}){
  if(!state.user) return;
  const menus=getMenusForPage(page);
  if(!menus.length) return;

  const missing=menus.filter(menu=>{
    if(force) return true;
    if(!state.data[menu]){
      const c=readMenuCache(menu);
      if(c){ state.data[menu]=c.data; state.loadedMenus[menu]=c.savedAt; return false; }
      return true;
    }
    return !hasFreshMenu(menu);
  });

  if(!missing.length){
    if(!silent) renderPage();
    return;
  }

  try{
    if(!silent) setLoading(true,"Menyiapkan data " + (page||"menu") + "...");
    const result=await api("getMenuData",{userName:state.user.username,menus:missing,fresh:force},{silent,dedupe:true,timeout:15000});
    if(!result.ok) throw new Error(result.message || "Gagal mengambil data.");
    applyMenuResult(result);
    renderPage();
  }catch(error){
    console.warn("ensureMenuData:",error);
    if(!silent) showToast(error.message || "Data belum dapat dimuat.","error");
  }finally{
    if(!silent) setLoading(false);
  }
}

    if(!silent) showToast(error.message || "Dashboard belum dapat dimuat.","error");
  }finally{
    if(!silent) setLoading(false);
  }
}

async function loadData(options={}){
  if(!state.user) return;

  const silent=Boolean(options.silent);
  const force=Boolean(options.force);

  const menus=[
    "Event",
    "Vendor",
    "Perlengkapan",
    "Invoice",
    "Pembayaran",
    "Cashflow",
    "LoginLog"
  ];

  try{

    if(!silent){
      setLoading(true,"Memuat data aplikasi...");
    }

    /*
      INITIAL LOAD:
      Bootstrap + seluruh tabel dijalankan bersamaan.
      Tidak lagi menunggu dashboard lalu menunggu menu lalu refresh background.
    */
    const [bootstrap,menuResult]=await Promise.all([
      api(
        "getBootstrap",
        {userName:state.user.username},
        {
          silent:true,
          dedupe:false,
          timeout:15000
        }
      ),

      api(
        "getMenuData",
        {
          userName:state.user.username,
          menus,
          fresh:force
        },
        {
          silent:true,
          dedupe:false,
          timeout:60000
        }
      )
    ]);

    if(!bootstrap || !bootstrap.ok){
      throw new Error(
        bootstrap?.message || "Session tidak valid."
      );
    }

    if(!menuResult || !menuResult.ok){
      throw new Error(
        menuResult?.message || "Data aplikasi gagal dimuat."
      );
    }

    applyBootstrap(bootstrap);
    applyMenuResult(menuResult);

    /*
      Dashboard dibuat dari data yang BARU SAJA dimuat.
      Jadi tidak ada request getDashboardSummary tambahan.
    */
    const events=Array.isArray(state.data.Event)
      ? state.data.Event
      : [];

    const vendors=Array.isArray(state.data.Vendor)
      ? state.data.Vendor
      : [];

    const invoices=Array.isArray(state.data.Invoice)
      ? state.data.Invoice
      : [];

    const payments=Array.isArray(state.data.Pembayaran)
      ? state.data.Pembayaran
      : [];

    applyDashboardResult({
      ok:true,
      data:{
        totalEvent:events.length,
        totalVendor:vendors.length,
        totalInvoice:invoices.length,
        totalPembayaran:payments.length,
        totalInvoiceValue:invoices.reduce(
          (sum,row)=>sum+Number(row["Total Harga"]||0),
          0
        ),
        totalPaid:payments.reduce(
          (sum,row)=>sum+Number(row["Nominal Dibayar"]||0),
          0
        ),
        recentEvents:events.slice(-8)
      }
    });

    renderPage();

    /*
      PENTING:
      Jangan jalankan refreshDataInBackground() pada login awal.
      Data yang tampil adalah data hasil request terbaru di atas.
    */

    return true;

  }catch(error){

    console.error("Initial data load gagal:",error);

    if(!silent){
      showToast(
        error.message || "Gagal memuat data aplikasi.",
        "error"
      );
    }

    /*
      Jangan anggap login sukses jika data utama gagal dimuat.
      Caller dapat mempertahankan halaman login.
    */
    throw error;

  }finally{

    if(!silent){
      setLoading(false);
    }

  }
}

let backgroundRefreshRunning=false;
function refreshDataInBackground(){
  if(!state.user || backgroundRefreshRunning) return;
  backgroundRefreshRunning=true;

  // Jangan kosongkan UI. Ambil data terbaru di background secara batch.
  const menus=["Event","Vendor","Perlengkapan","Invoice","Pembayaran","Cashflow","LoginLog"];

  Promise.all([
    api("getDashboardSummary",{userName:state.user.username,fresh:true},{silent:true,dedupe:false,timeout:60000}),
    api("getMenuData",{userName:state.user.username,menus,fresh:true},{silent:true,dedupe:false,timeout:60000})
  ])
  .then(([dashboardResult,menuResult])=>{
    if(dashboardResult && dashboardResult.ok) applyDashboardResult(dashboardResult);
    if(menuResult && menuResult.ok) applyMenuResult(menuResult);
    renderPage();
  })
  .catch(e=>console.warn("Background refresh gagal:",e))
  .finally(()=>{backgroundRefreshRunning=false;});
}


/* =====================================================
API
===================================================== */

const apiInflight = new Map();

async function supabaseFetch(table, query="", options={}){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), Number(options.timeout || 30000));

  try{
    const path = String(table || "");

    // RPC memakai path /rest/v1/rpc/<function>.
    // Jangan encode seluruh string karena "/" harus tetap menjadi separator URL.
    const endpoint = path.startsWith("rpc/")
      ? SUPABASE_REST_URL + "/" + path
      : SUPABASE_REST_URL + "/" + encodeURIComponent(path);

    const response = await fetch(
      endpoint + (query ? "?" + query : ""),
      {
        method: options.method || "GET",
        headers:{
          ...SUPABASE_HEADERS,
          "Content-Type":"application/json",
          ...(options.prefer ? {"Prefer":options.prefer}: {})
        },
        body: options.body == null ? undefined : JSON.stringify(options.body),
        signal:controller.signal,
        cache:"no-store"
      }
    );

    const raw=await response.text();
    let data=null;

    try{
      data=raw ? JSON.parse(raw) : null;
    }catch(e){
      data=raw;
    }

    if(!response.ok){
      const msg =
        data?.message ||
        data?.details ||
        data?.hint ||
        data?.error ||
        (typeof data === "string"
          ? data
          : "Supabase error " + response.status);

      throw new Error(msg);
    }

    return data;

  }catch(error){

    if(error.name === "AbortError"){
      throw new Error("Supabase terlalu lama merespons.");
    }

    throw error;

  }finally{

    clearTimeout(timeout);

  }
}

async function supabaseRpc(functionName, body={}, options={}){
  return await supabaseFetch(
    "rpc/" + functionName,
    "",
    {
      method:"POST",
      body,
      timeout:options.timeout || 15000
    }
  );
}

function sbQuery(params){
  const q=[];
  Object.entries(params||{}).forEach(([key,value])=>{
    if(value === undefined || value === null) return;
    q.push(encodeURIComponent(key)+"="+encodeURIComponent(value));
  });
  return q.join("&");
}

function nowBy(username){
  const d=new Date();
  return d.toLocaleString("id-ID",{dateStyle:"short",timeStyle:"medium"}) + " by " + (username || "system");
}

function makeId(prefix){
  return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
}

function normalizeUser(row){
  if(!row) return null;
  return {
    username: row.Username ?? row.username ?? "",
    nama: row["Nama Lengkap"] ?? row.nama ?? row.Nama ?? row.Username ?? "",
    role: row.Role ?? row.role ?? "User"
  };
}

async function getAllRows(table, options={}){
  const query=sbQuery({select:"*",order:options.order || undefined});
  return await supabaseFetch(SB_TABLES[table] || table,query,{timeout:options.timeout || 30000});
}

async function getOneBy(table,key,value){
  const query=sbQuery({select:"*",[key]:"eq."+String(value),limit:1});
  const rows=await supabaseFetch(SB_TABLES[table] || table,query,{timeout:30000});
  return Array.isArray(rows) ? (rows[0] || null) : null;
}

async function insertRow(table,row){
  const result=await supabaseFetch(SB_TABLES[table] || table,"select=*",{
    method:"POST",body:row,prefer:"return=representation",timeout:30000
  });
  return Array.isArray(result) ? result[0] : result;
}

async function updateRow(table,key,value,row){
  const query=sbQuery({[key]:"eq."+String(value)});
  const result=await supabaseFetch(SB_TABLES[table] || table,query,{
    method:"PATCH",body:row,prefer:"return=representation",timeout:30000
  });
  return Array.isArray(result) ? result[0] : result;
}

async function deleteRow(table,key,value){
  const query=sbQuery({[key]:"eq."+String(value)});
  await supabaseFetch(SB_TABLES[table] || table,query,{method:"DELETE",prefer:"return=minimal",timeout:30000});
}

function invoiceTotal(items){
  return (items||[]).reduce((sum,item)=>sum + Number(item.qty||0)*Number(item.price||0),0);
}

function invoiceDetailText(items){
  return (items||[]).map(item=>`${item.desc} x${Number(item.qty||0)}`).join("\n");
}

async function api(action,payload={},options={}){
  const silent=Boolean(options.silent);
  const dedupe=options.dedupe !== false;
  const key=action+"::"+JSON.stringify(payload||{});
  if(dedupe && apiInflight.has(key)) return apiInflight.get(key);

  const promise=(async()=>{
    if(!silent) setProgress(10);
    try{
      let result={ok:true,data:null,message:"Berhasil."};

      /* ---------- AUTH ---------- */
      if(action === "login"){
        const inputUsername=String(payload.username ?? "").trim();
        const inputPassword=String(payload.password ?? "");

        if(!inputUsername || !inputPassword){
          return {
            ok:false,
            message:"Username dan password wajib diisi."
          };
        }

        /*
          LOGIN TIDAK LAGI SELECT langsung ke tabel Users.
          Browser hanya memanggil RPC login_user yang berjalan
          sebagai SECURITY DEFINER di Supabase.
        */
        const rpcResult = await supabaseRpc(
          "login_user",
          {
            p_username:inputUsername,
            p_password:inputPassword
          },
          {timeout:15000}
        );

        if(!rpcResult){
          return {
            ok:false,
            message:"Supabase tidak mengembalikan hasil login."
          };
        }

        // RPC mengembalikan {ok, message, user}.
        if(rpcResult.ok !== true){
          return {
            ok:false,
            message:rpcResult.message || "Username atau password salah."
          };
        }

        const user = normalizeUser(rpcResult.user);

        if(!user || !user.username){
          return {
            ok:false,
            message:"Data user dari Supabase tidak lengkap."
          };
        }

        // Permissions dikirim oleh RPC agar browser tidak perlu
        // membaca tabel Users/Permission secara langsung saat login.
        user.permissions = rpcResult.user.permissions || {};

        // LoginLog bersifat optional. Jika RLS menghalangi insert,
        // login tetap dianggap berhasil.
        try{
          await insertRow("LoginLog",{
            "Username":user.username,
            "Nama Lengkap":user.nama,
            "Role":user.role,
            "Waktu Login":new Date().toISOString()
          });
        }catch(e){
          console.warn("LoginLog tidak tersimpan:",e.message);
        }

        return {
          ok:true,
          user,
          message:"Login berhasil."
        };
      }

      if(action === "getBootstrap"){
        /*
          Session browser sudah menyimpan user hasil RPC login_user.
          Jangan SELECT ulang tabel Users karena request browser
          menggunakan anon key dan dapat terkena RLS.
        */
        const currentUser = state.user;

        if(
          !currentUser ||
          !currentUser.username
        ){
          return {
            ok:false,
            message:"Session user tidak ditemukan."
          };
        }

        const role = String(currentUser.role || "User");
        let permissions = currentUser.permissions || {};

        /*
          Jika permission belum ikut tersimpan di session lama,
          coba baca tabel Permission. Ini hanya fallback.
        */
        if(!Object.keys(permissions).length){
          try{
            const rows = await supabaseFetch(
              SB_TABLES.Permissions,
              sbQuery({
                select:"*",
                Role:"eq."+role
              }),
              {timeout:10000}
            );

            (rows || []).forEach(r=>{
              permissions[r.Menu]={
                CanView:Boolean(r.CanView),
                CanAdd:Boolean(r.CanAdd),
                CanEdit:Boolean(r.CanEdit),
                CanDelete:Boolean(r.CanDelete),
                CanExport:Boolean(r.CanExport),
                Configured:true
              };
            });

          }catch(e){
            console.warn("Permission fallback gagal:",e.message);
          }
        }

        // Superadmin selalu mendapat akses penuh.
        if(
          String(role).toLowerCase() === "superadmin" &&
          !Object.keys(permissions).length
        ){
          const menus=[
            "Dashboard",
            "Event",
            "Vendor",
            "Perlengkapan",
            "Invoice",
            "Pembayaran",
            "Cashflow",
            "LoginLog"
          ];

          menus.forEach(menu=>{
            permissions[menu]={
              CanView:true,
              CanAdd:true,
              CanEdit:true,
              CanDelete:true,
              CanExport:true,
              Configured:true
            };
          });
        }

        currentUser.permissions = permissions;

        return {
          ok:true,
          userRole:role,
          permissions
        };
      }

      if(action === "getMenuData"){
        const menus=Array.isArray(payload.menus)
          ? payload.menus
          : [];

        /*
          Semua tabel dibaca paralel agar initial load jauh lebih cepat.
          Sebelumnya tabel dibaca satu per satu.
        */
        const results=await Promise.all(
          menus.map(async menu=>{
            try{
              const rows=await getAllRows(menu,{
                timeout:60000
              });

              return {
                menu,
                rows:Array.isArray(rows) ? rows : []
              };

            }catch(e){

              throw new Error(
                "Gagal membaca tabel " +
                menu +
                ": " +
                e.message
              );

            }
          })
        );

        const data={};

        results.forEach(item=>{
          data[item.menu]=item.rows;
        });

        return {
          ok:true,
          data
        };
      }

      if(action === "getDashboardSummary"){
        const [events,vendors,invoices,payments]=await Promise.all([
          getAllRows("Event"),getAllRows("Vendor"),getAllRows("Invoice"),getAllRows("Pembayaran")
        ]);
        return {ok:true,data:{
          totalEvent:events.length,
          totalVendor:vendors.length,
          totalInvoice:invoices.length,
          totalPembayaran:payments.length,
          totalInvoiceValue:invoices.reduce((s,r)=>s+Number(r["Total Harga"]||0),0),
          totalPaid:payments.reduce((s,r)=>s+Number(r["Nominal Dibayar"]||0),0),
          recentEvents:events.slice(-8)
        }};
      }

      /* ---------- PERMISSIONS ---------- */
      if(action === "getPermissions"){
        const rows=await getAllRows("Permission");
        return {ok:true,permissions:rows};
      }
      if(action === "savePermissions"){
        for(const row of (payload.permissions||[])){
          const existing=await getOneBy("Permission","Role",row.Role);
          if(existing) await updateRow("Permission","Role",row.Role,row);
          else await insertRow("Permission",row);
        }
        return {ok:true,message:"Hak akses berhasil disimpan."};
      }

      /* ---------- PASSWORD ---------- */
      if(action === "changePassword"){
        if(
          !payload.username ||
          !payload.oldPassword ||
          !payload.newPassword
        ){
          return {
            ok:false,
            message:"Data password belum lengkap."
          };
        }

        const rpcResult = await supabaseRpc(
          "change_user_password",
          {
            p_username:String(payload.username).trim(),
            p_old_password:String(payload.oldPassword),
            p_new_password:String(payload.newPassword)
          },
          {timeout:15000}
        );

        return rpcResult || {
          ok:false,
          message:"Gagal mengubah password."
        };
      }

      /* ---------- EVENT ---------- */
      if(action === "saveEvent" || action === "updateEvent"){
        const id=payload.id || makeId("EVT-");
        const row={
          "ID Event":id,
          "Nama Event":payload.namaEvent,
          "Tanggal Pelaksanaan":payload.tanggal,
          "Lokasi":payload.lokasi,
          "Status":payload.status,
          ...(action==="saveEvent" ? {"Input At & By":nowBy(payload.userName)} : {"Edit At & By":nowBy(payload.userName)})
        };
        const data=action==="saveEvent" ? await insertRow("Event",row) : await updateRow("Event","ID Event",id,row);
        return {ok:true,data:data||row,message:action==="saveEvent"?"Event berhasil ditambahkan.":"Event berhasil diperbarui."};
      }

      /* ---------- VENDOR ---------- */
      if(action === "saveVendor" || action === "updateVendor"){
        const id=payload.id || makeId("VND-");
        const row={"ID Vendor":id,"Nama Vendor":payload.namaVendor,"PIC":payload.pic,"Nomor Telepon/Whatsapp":payload.phone,"No Rekening":payload.rekening,
          ...(action==="saveVendor" ? {"Input At & By":nowBy(payload.userName)} : {"Edit At & By":nowBy(payload.userName)})};
        const data=action==="saveVendor" ? await insertRow("Vendor",row) : await updateRow("Vendor","ID Vendor",id,row);
        return {ok:true,data:data||row,message:action==="saveVendor"?"Vendor berhasil ditambahkan.":"Vendor berhasil diperbarui."};
      }

      /* ---------- PERLENGKAPAN ---------- */
      if(action === "savePerlengkapan" || action === "updatePerlengkapan"){
        const id=payload.id || makeId("ITM-");
        const row={"ID Item":id,"Nama Event":payload.namaEvent,"Nama Item":payload.namaItem,"Qty":Number(payload.qty||0),"Status":payload.status,
          ...(action==="savePerlengkapan" ? {"Input At & By":nowBy(payload.userName)} : {"Edit At & By":nowBy(payload.userName)})};
        const data=action==="savePerlengkapan" ? await insertRow("Perlengkapan",row) : await updateRow("Perlengkapan","ID Item",id,row);
        return {ok:true,data:data||row,message:action==="savePerlengkapan"?"Perlengkapan berhasil ditambahkan.":"Perlengkapan berhasil diperbarui."};
      }

      /* ---------- INVOICE ---------- */
      if(action === "saveInvoice" || action === "updateInvoice"){
        const no=String(payload.noInvoice||"").trim();
        if(!no) return {ok:false,message:"Nomor invoice wajib diisi."};
        const items=Array.isArray(payload.items)?payload.items:[];
        const total=invoiceTotal(items);
        const existing=await getOneBy("Invoice","No Invoice",no);
        if(action==="saveInvoice" && existing) return {ok:false,message:"Nomor invoice sudah digunakan."};
        const row={"No Invoice":no,"Nama Event":payload.namaEvent,"Nama Vendor":payload.namaVendor,"PIC Vendor":payload.picVendor,"No Rekening":payload.noRekening,
          "Item":JSON.stringify(items),"Total Harga":total,"Bukti Invoice":payload.buktiInvoiceUrl || existing?.["Bukti Invoice"] || "",
          ...(action==="saveInvoice" ? {"Input At & By":nowBy(payload.userName)} : {"Edit At & By":nowBy(payload.userName)})};
        const data=action==="saveInvoice" ? await insertRow("Invoice",row) : await updateRow("Invoice","No Invoice",no,row);
        return {ok:true,data:data||row,message:action==="saveInvoice"?"Invoice berhasil ditambahkan.":"Invoice berhasil diperbarui."};
      }

      /* ---------- PAYMENT ---------- */
      if(action === "savePembayaran" || action === "updatePembayaran"){
        const id=payload.id || makeId("PAY-");
        const inv=await getOneBy("Invoice","No Invoice",payload.noInvoice);
        if(!inv) return {ok:false,message:"Invoice tidak ditemukan."};
        const nominal=Number(payload.nominalDibayar||0);
        const total=Number(inv["Total Harga"]||0);
        const row={"ID Bayar":id,"Nama Event":inv["Nama Event"]||"","No Invoice":payload.noInvoice,"Nama Vendor & PIC":((inv["Nama Vendor"]||"") + (inv["PIC Vendor"] ? " / " + inv["PIC Vendor"] : "")),"Rincian Item":inv["Item"]||"","Total Tagihan":total,"Skema Bayar":payload.skemaBayar,"Nominal Dibayar":nominal,"Sisa Tagihan":Math.max(total-nominal,0),"Status":nominal>=total?"Lunas":nominal>0?"Sebagian":"Belum Bayar"};
        const data=action==="savePembayaran" ? await insertRow("Pembayaran",row) : await updateRow("Pembayaran","ID Bayar",id,row);
        return {ok:true,data:data||row,message:action==="savePembayaran"?"Pembayaran berhasil ditambahkan.":"Pembayaran berhasil diperbarui."};
      }

      /* ---------- CASHFLOW ---------- */
      if(action === "saveCashflow" || action === "updateCashflow"){
        const id=payload.id || makeId("CF-");
        const row={"ID Cashflow":id,"Nama Event":payload.namaEvent,"Tanggal":payload.tanggal,"Jenis":payload.jenis,"Kategori":payload.kategori,"Deskripsi":payload.deskripsi,"Nominal":Number(payload.nominal||0),"Metode":payload.metode,
          ...(action==="saveCashflow" ? {"Input At & By":nowBy(payload.userName)} : {"Edit At & By":nowBy(payload.userName)})};
        const data=action==="saveCashflow" ? await insertRow("Cashflow",row) : await updateRow("Cashflow","ID Cashflow",id,row);
        return {ok:true,data:data||row,message:action==="saveCashflow"?"Cashflow berhasil ditambahkan.":"Cashflow berhasil diperbarui."};
      }

      /* ---------- DELETE ---------- */
      const deleteMap={deleteEvent:["Event","ID Event"],deleteVendor:["Vendor","ID Vendor"],deletePerlengkapan:["Perlengkapan","ID Item"],deleteInvoice:["Invoice","No Invoice"],deletePembayaran:["Pembayaran","ID Bayar"],deleteCashflow:["Cashflow","ID Cashflow"]};
      if(deleteMap[action]){
        const [table,keyField]=deleteMap[action];
        await deleteRow(table,keyField,payload.id);
        return {ok:true,message:"Data berhasil dihapus."};
      }

      return {ok:false,message:"Action Supabase tidak dikenali: " + action};
    }catch(error){
      console.error("Supabase API",action,error);
      return {ok:false,message:error.message || "Gagal terhubung ke Supabase."};
    }finally{
      if(!silent){ setProgress(100); setTimeout(()=>setProgress(0),180); }
    }
  })();
  if(dedupe) apiInflight.set(key,promise);
  try{return await promise;}finally{if(dedupe) apiInflight.delete(key);}
}


/* =====================================================
LOGIN
===================================================== */

document.getElementById(
  "togglePassword"
).addEventListener(
  "click",
  function(){

    const input =
      document.getElementById(
        "loginPassword"
      );

    if(input.type === "password"){

      input.type = "text";
      this.textContent = "🙈";

    }else{

      input.type = "password";
      this.textContent = "👁";

    }

  }
);


document.getElementById(
  "loginForm"
).addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const username =
      document.getElementById(
        "loginUsername"
      ).value.trim();

    const password =
      document.getElementById(
        "loginPassword"
      ).value;

    const errorBox =
      document.getElementById(
        "loginError"
      );

    errorBox.classList.add("hidden");

    const button =
      document.getElementById(
        "loginButton"
      );

    button.disabled = true;
    button.textContent = "Login...";

    try{

      const result =
        await api(
          "login",
          {
            username,
            password
          }
        );

      if(!result.ok){

        throw new Error(
          result.message ||
          "Login gagal."
        );

      }

      state.user =
        result.user;

      localStorage.setItem(
        "eventAdminUser",
        JSON.stringify(
          state.user
        )
      );

      /*
        Jangan tampilkan aplikasi sebagai login sukses dulu.
        Data utama harus selesai dimuat terlebih dahulu.
      */
      updateUserUI();

      try{

        await loadData({
          silent:false,
          force:true
        });

      }catch(loadError){

        /*
          Jika login berhasil tetapi data gagal dimuat,
          kembalikan state ke halaman login agar user tidak
          masuk ke aplikasi dalam kondisi kosong.
        */
        state.user=null;
        state.permissions={};
        localStorage.removeItem("eventAdminUser");

        document.getElementById(
          "app"
        ).classList.add("hidden");

        document.getElementById(
          "loginPage"
        ).classList.remove("hidden");

        throw new Error(
          "Login berhasil, tetapi data aplikasi gagal dimuat. " +
          (loadError.message || "")
        );
      }

      /*
        Baru setelah bootstrap + seluruh data berhasil:
        tampilkan aplikasi dan popup welcome.
      */
      document.getElementById(
        "loginPage"
      ).classList.add("hidden");

      document.getElementById(
        "app"
      ).classList.remove("hidden");

      updateUserUI();

      renderPage();

      showWelcome();

    }catch(error){

      errorBox.textContent =
        error.message ||
        "Login gagal.";

      errorBox.classList.remove(
        "hidden"
      );

    }finally{

      button.disabled = false;
      button.textContent = "Login";

    }

  }
);

function restoreSession(){

  try{

    const raw =
      localStorage.getItem(
        "eventAdminUser"
      );

    if(!raw) return false;

    const user =
      JSON.parse(raw);

    if(
      !user ||
      !user.username
    )
      return false;

    state.user = user;

    return true;

  }catch(e){

    return false;

  }

}


function logout(){

  clearClientCache();

  localStorage.removeItem(
    "eventAdminUser"
  );

  state = {
    user:null,
    data:{},
    page:"dashboard",
    editId:null,
    permissions:{},
    permissionAdmin:null,
    dashboard:null,
    loadedMenus:{}
  };

  document.getElementById(
    "app"
  ).classList.add("hidden");

  document.getElementById(
    "loginPage"
  ).classList.remove("hidden");

  document.getElementById(
    "loginUsername"
  ).value = "";

  document.getElementById(
    "loginPassword"
  ).value = "";

  closeModal();

}

/* =====================================================
PERMISSION
===================================================== */

function isSuperadmin(){

  return String(
    state.user?.role || ""
  ).toLowerCase() ===
  "superadmin";

}


function getPermission(menu){

  if(isSuperadmin()){

    return {
      CanView:true,
      CanAdd:true,
      CanEdit:true,
      CanDelete:true,
      CanExport:true,
      Configured:true
    };

  }

  const permissions =
    state.permissions || {};

  let found =
    permissions[menu];

  if(!found){

    const key =
      Object.keys(
        permissions
      ).find(
        k =>
          String(k).toLowerCase() ===
          String(menu).toLowerCase()
      );

    if(key)
      found = permissions[key];

  }

  if(
    !found ||
    found.Configured === false ||
    found.Configured === "" ||
    found.Configured === undefined
  ){

    return {
      CanView:true,
      CanAdd:true,
      CanEdit:true,
      CanDelete:true,
      CanExport:true,
      Configured:false
    };

  }

  return {
    CanView:Boolean(found.CanView),
    CanAdd:Boolean(found.CanAdd),
    CanEdit:Boolean(found.CanEdit),
    CanDelete:Boolean(found.CanDelete),
    CanExport:Boolean(found.CanExport),
    Configured:true
  };

}


function can(menu,action){

  return Boolean(
    getPermission(menu)[action]
  );

}


function pageToMenu(page){

  const map = {
    dashboard:"Dashboard",
    event:"Event",
    vendor:"Vendor",
    perlengkapan:"Perlengkapan",
    invoice:"Invoice",
    pembayaran:"Pembayaran",
    cashflow:"Cashflow",
    loginlog:"LoginLog"
  };

  return map[page] || null;

}


function applyPermissions(){

  document.querySelectorAll(
    ".nav-item[data-menu]"
  ).forEach(button=>{

    const menu =
      button.dataset.menu;

    button.classList.toggle(
      "hidden",
      !getPermission(menu).CanView
    );

  });

}


/* =====================================================
NAVIGATION
===================================================== */

document.querySelectorAll(
  ".nav-item[data-page]"
).forEach(button=>{

  button.addEventListener(
    "click",
    function(){

      navigate(
        this.dataset.page
      );

      document.getElementById(
        "sidebar"
      ).classList.remove("open");

    }
  );

});


function navigate(page){

  if(
    page !== "permissions"
  ){

    const menu =
      pageToMenu(page);

    if(
      menu &&
      !can(menu,"CanView")
    ){

      showToast(
        "Anda tidak memiliki akses ke menu ini.",
        "error"
      );

      return;

    }

  }

  if(
    page === "permissions" &&
    !isSuperadmin()
  ){

    showToast(
      "Hanya Superadmin yang dapat mengatur hak akses.",
      "error"
    );

    return;

  }

  state.page = page;
  state.editId = null;

  // Render seketika dari cache/state lama, lalu ambil data terbaru di belakang.
  renderPage();
  if(page === "dashboard") loadDashboard({silent:true});
  else if(page === "permissions") { /* renderPermissionsPage() memuat datanya sendiri */ }
  else ensureMenuData(page,{silent:true});

}


function renderPage(){

  const titles = {
    dashboard:"Dashboard",
    event:"Event",
    vendor:"Vendor",
    perlengkapan:"Perlengkapan",
    invoice:"Invoice",
    pembayaran:"Pembayaran",
    cashflow:"Cashflow",
    loginlog:"Login Log",
    permissions:"Hak Akses"
  };

  document.getElementById(
    "pageTitle"
  ).textContent =
    titles[state.page] ||
    "Dashboard";

  document.querySelectorAll(
    ".nav-item[data-page]"
  ).forEach(button=>{

    button.classList.toggle(
      "active",
      button.dataset.page ===
      state.page
    );

  });

  const content =
    document.getElementById(
      "content"
    );

  switch(state.page){

    case "dashboard":
      renderDashboard(content);
      break;

    case "event":
      renderEventPage(content);
      break;

    case "vendor":
      renderVendorPage(content);
      break;

    case "perlengkapan":
      renderPerlengkapanPage(content);
      break;

    case "invoice":
      renderInvoicePage(content);
      break;

    case "pembayaran":
      renderPembayaranPage(content);
      break;

    case "cashflow":
      renderCashflowPage(content);
      break;

    case "loginlog":
      renderLoginLogPage(content);
      break;

    case "permissions":
      renderPermissionsPage(content);
      break;

    default:
      renderDashboard(content);

  }

}

function statusBadge(status){

  const value =
    String(status || "-");

  const lower =
    value.toLowerCase();

  let cls =
    "badge-gray";

  if(
    [
      "aktif",
      "ready",
      "lunas",
      "berhasil",
      "selesai",
      "open"
    ].includes(lower)
  ){

    cls =
      lower === "open"
      ? "badge-info"
      : "badge-success";

  }else if(
    [
      "draft",
      "sebagian",
      "proses",
      "pending"
    ].includes(lower)
  ){

  }

  return `
    <span class="badge ${cls}">

    </span>
  `;

}

/*
  INI BAGIAN PENTING.

  Jangan menggunakan onclick inline untuk Edit/Hapus.
  Tabel selalu dibuat ulang menggunakan innerHTML.
  Event delegation membuat tombol tetap bekerja
  setelah tabel dirender ulang.
*/

document.addEventListener(
  "click",
  function(e){

    const editButton =
      e.target.closest(
        ".btn-edit-record"
      );

    if(editButton){

      const menu =
        editButton.dataset.menu;

      const id =
        editButton.dataset.id;

      console.log(
        "EDIT:",
        menu,
        id
      );

      editRecord(
        menu,
        id
      );

      return;
    }


    const deleteButton =
      e.target.closest(
        ".btn-delete-record"
      );

    if(deleteButton){

      const menu =
        deleteButton.dataset.menu;

      const id =
        deleteButton.dataset.id;

      deleteRecord(
        menu,
        id
      );

      return;
    }

  }
);


/* =====================================================
EDIT ROUTER
===================================================== */

function editRecord(menu,id){

  menu =
    String(menu || "").trim();

  id =
    String(id || "").trim();

  if(!id){

    showToast(
      "ID data tidak ditemukan.",
      "error"
    );

    return;

  }


  switch(menu){

    case "Event":
      openEventModal(id);
      break;

    case "Vendor":
      openVendorModal(id);
      break;

    case "Perlengkapan":
      openPerlengkapanModal(id);
      break;

    case "Invoice":
      openInvoiceModal(id);
      break;

    case "Pembayaran":
      openPembayaranModal(id);
      break;

    case "Cashflow":
      openCashflowModal(id);
      break;

    default:

      showToast(
        "Menu edit tidak dikenali: " +
        menu,
        "error"
      );

  }

}

/* =====================================================
INVOICE PARSER
===================================================== */

function parseInvoiceItemsFrontend(raw){

  if(!raw)
    return [];

  if(Array.isArray(raw))
    return raw;

  try{

    const parsed =
      JSON.parse(
        String(raw)
      );

    return Array.isArray(parsed)
      ? parsed
      : [];

  }catch(e){

    return [];

  }

}


function invoiceItemsDisplay(raw){

  const items =
    parseInvoiceItemsFrontend(
      raw
    );

  if(!items.length){

    const text =
      String(raw || "").trim();

    return text
      ? escapeHtml(text)
      : "-";

  }

  return items
    .map(item=>
      escapeHtml(
        item.desc ||
        item.item ||
        item.namaItem ||
        "-"
      )
    )
    .join("<br>");

}


function invoiceQtyDisplay(row){

  if(
    row["Qty"] !== undefined &&
    row["Qty"] !== null &&
    String(row["Qty"]).trim() !== ""
  ){

    return escapeHtml(
      row["Qty"]
    );

  }

  const items =
    parseInvoiceItemsFrontend(
      row["Item"]
    );

  if(!items.length)
    return "-";

  return items.reduce(
    (sum,item)=>
      sum +
      Number(item.qty || 0),
    0
  );

}

function getSelectedCashflowEvent(){

function setSelectedCashflowEvent(value){
  localStorage.setItem("eventAdminCashflowEvent",String(value || ""));
}

function renderCashflowPage(container){

  const events = state.data.Event || [];
  const allRows = state.data.Cashflow || [];
  const selectedEvent = getSelectedCashflowEvent();
  const validSelected = events.some(e=>String(e["Nama Event"]||"")===selectedEvent) ? selectedEvent : "";

  if(validSelected !== selectedEvent) setSelectedCashflowEvent("");

  const rows = validSelected
    ? allRows.filter(row=>String(row["Nama Event"]||"")===validSelected)
    : [];

  const pemasukan = rows.filter(r=>String(r["Jenis"]||"")==="Pemasukan").reduce((s,r)=>s+Number(r["Nominal"]||0),0);
  const pengeluaran = rows.filter(r=>String(r["Jenis"]||"")==="Pengeluaran").reduce((s,r)=>s+Number(r["Nominal"]||0),0);
  const saldo = pemasukan-pengeluaran;

  const buttons = `
    ${validSelected && can("Cashflow","CanAdd") ? '<button class="btn btn-primary" id="addCashflowButton">+ Tambah Transaksi</button>' : ''}
    ${validSelected && can("Cashflow","CanExport") ? '<button class="btn btn-secondary" id="exportCashflowButton">Export</button>' : ''}
  `;

  container.innerHTML = `
    ${pageHeader("Cashflow","Kelola pemasukan dan pengeluaran untuk event yang dipilih.",buttons)}

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Pilih Event</div>

      </div>
      <div style="padding:18px">
        <select id="cashflowEventSelect" class="form-control" style="max-width:620px">
          <option value="">— Pilih Event —</option>

      </div>
    </div>

    ${validSelected ? `
      <div class="stats-grid" style="margin-top:18px">
        <div class="stat-card">
          <div class="stat-label">Total Pemasukan</div>
          <div class="stat-value">${formatRupiah(pemasukan)}</div>
          <div class="stat-note">Event: ${escapeHtml(validSelected)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Pengeluaran</div>
          <div class="stat-value">${formatRupiah(pengeluaran)}</div>
          <div class="stat-note">Seluruh transaksi pengeluaran</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Saldo Cashflow</div>
          <div class="stat-value">${formatRupiah(saldo)}</div>
          <div class="stat-note">Pemasukan − Pengeluaran</div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <div class="card-header">
          <div class="card-title">Transaksi Cashflow — ${escapeHtml(validSelected)}</div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Deskripsi</th><th>Metode</th><th>Nominal</th><th>Input At & By</th><th>Edit At & By</th><th>Aksi</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.slice().reverse().map(row=>`
                <tr>
                  <td>${escapeHtml(row["Tanggal"]||"")}</td>
                  <td>${statusBadge(row["Jenis"]||"")}</td>
                  <td>${escapeHtml(row["Kategori"]||"")}</td>
                  <td>${escapeHtml(row["Deskripsi"]||"")}</td>
                  <td>${escapeHtml(row["Metode"]||"")}</td>
                  <td><strong>${formatRupiah(row["Nominal"]||0)}</strong></td>
                  <td>${escapeHtml(row["Input At & By"]||"")}</td>
                  <td>${escapeHtml(row["Edit At & By"]||"-")}</td>
                  <td>${crudButtons("Cashflow",row["ID Cashflow"])}</td>

      </div>

    setSelectedCashflowEvent(e.target.value);

  document.getElementById("exportCashflowButton")?.addEventListener("click",()=>exportData("Cashflow"));

async function saveCashflowForm(e){
  e.preventDefault();
  const payload={
    userName:state.user.username,
    id:state.editId||"",
    namaEvent:document.getElementById("cashflowEvent").value,
    tanggal:document.getElementById("cashflowTanggal").value,
    jenis:document.getElementById("cashflowJenis").value,
    kategori:document.getElementById("cashflowKategori").value.trim(),
    deskripsi:document.getElementById("cashflowDeskripsi").value.trim(),
    nominal:Number(document.getElementById("cashflowNominal").value||0),
    metode:document.getElementById("cashflowMetode").value
  };

  setLoading(true,state.editId?"Menyimpan perubahan cashflow...":"Menyimpan cashflow...");
  try{
    const action=state.editId?"updateCashflow":"saveCashflow";
    const result=await api(action,payload,{timeout:60000});
    if(!result.ok) throw new Error(result.message||"Gagal menyimpan cashflow.");
    closeModal();
    showToast(result.message||"Cashflow berhasil disimpan.","success");
    applyMutationResult(action,result,payload);
    navigate("cashflow");
  }catch(error){
    showToast(error.message||"Gagal menyimpan cashflow.","error");
  }finally{
    setLoading(false);
  }
}

function addInvoiceItem(
  desc="",
  qty=1,
  price=0
){

  const body =
    document.getElementById(
      "invoiceItemsBody"
    );

  if(!body) return;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "invoice-item-row";

  row.innerHTML = `

    <input
      class="form-control item-desc"
      placeholder="Nama item"
      value="${escapeHtml(desc)}"
      required
    >

    <input
      class="form-control item-qty"
      type="number"
      min="1"
      value="${Number(qty || 1)}"
      required
    >

    <input
      class="form-control item-price"
      type="number"
      min="0"
      value="${Number(price || 0)}"
      required
    >

    <button
      type="button"
      class="item-remove"
      data-remove-invoice-item
    >
      ×
    </button>

  `;

  body.appendChild(row);

  updateInvoiceTotal();

}


document.addEventListener(
  "click",
  function(e){

    const remove =
      e.target.closest(
        "[data-remove-invoice-item]"
      );

    if(remove){

      const row =
        remove.closest(
          ".invoice-item-row"
        );

      if(row)
        row.remove();

      updateInvoiceTotal();

    }

  }
);


function collectInvoiceItems(){

  const rows =
    document.querySelectorAll(
      "#invoiceItemsBody .invoice-item-row"
    );

  return Array.from(rows)
    .map(row=>({

      desc:
        row.querySelector(
          ".item-desc"
        ).value.trim(),

      qty:
        Number(
          row.querySelector(
            ".item-qty"
          ).value || 0
        ),

      price:
        Number(
          row.querySelector(
            ".item-price"
          ).value || 0
        )

    }))
    .filter(
      item=>item.desc
    );

}


function updateInvoiceTotal(){

  const items =
    collectInvoiceItems();

  const total =
    items.reduce(
      (sum,item)=>
        sum +
        Number(item.qty || 0) *
        Number(item.price || 0),
      0
    );

  const element =
    document.getElementById(
      "invoiceTotalDisplay"
    );

  if(element){

    element.textContent =
      formatRupiah(total);

  }

}

async function saveInvoiceForm(e){
  e.preventDefault();

  const file=document.getElementById("invoiceProof")?.files?.[0] || null;
  const noInvoice=document.getElementById("invoiceNo").value.trim();
  let proofUrl="";

  setLoading(true,"Menyimpan invoice...");
  try{
    // Upload file langsung ke Supabase Storage. Database hanya menyimpan URL.
    if(file){
      proofUrl=await uploadInvoiceProof(file,noInvoice);
    }else{
      const current=(state.data.Invoice||[]).find(r=>String(r["No Invoice"]||"")===noInvoice)||{};
      proofUrl=current["Bukti Invoice"] || "";
    }

    const payload={
      userName:state.user.username,
      id:state.editId||"",
      noInvoice,
      namaEvent:document.getElementById("invoiceEvent").value,
      namaVendor:document.getElementById("invoiceVendor").value,
      picVendor:document.getElementById("invoicePic").value.trim(),
      noRekening:document.getElementById("invoiceRekening").value.trim(),
      items:collectInvoiceItems(),
      buktiInvoiceUrl:proofUrl
    };

    const action=state.editId ? "updateInvoice" : "saveInvoice";
    const result=await api(action,payload,{timeout:60000});
    if(!result.ok) throw new Error(result.message || "Gagal menyimpan invoice.");

    closeModal();
    showToast(result.message,"success");
    applyMutationResult(action,result,payload);
    navigate("invoice");
  }catch(error){
    showToast(error.message || "Gagal menyimpan invoice.","error");
  }finally{
    setLoading(false);
  }
}

async function uploadInvoiceProof(file,noInvoice){
  const maxSize=10*1024*1024;
  if(file.size>maxSize) throw new Error("Ukuran bukti invoice maksimal 10 MB.");
  const allowed=["application/pdf","image/jpeg","image/png","image/webp"];
  if(file.type && !allowed.includes(file.type)) throw new Error("Format bukti invoice harus PDF, JPG, PNG, atau WEBP.");

  const safeInvoice=String(noInvoice||"invoice").replace(/[^a-zA-Z0-9_-]/g,"_");
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${safeInvoice}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const response=await fetch(`${SUPABASE_STORAGE_URL}/object/${encodeURIComponent(SUPABASE_INVOICE_BUCKET)}/${path}`,{
    method:"POST",
    headers:{...SUPABASE_HEADERS,"Content-Type":file.type || "application/octet-stream","x-upsert":"true"},
    body:file
  });
  const raw=await response.text();
  if(!response.ok){
    let msg=raw;
    try{const j=JSON.parse(raw);msg=j.message||j.error||j.statusCode||raw;}catch(e){}
    throw new Error("Upload bukti invoice gagal: " + msg);
  }
  return `${SUPABASE_STORAGE_URL}/object/public/${encodeURIComponent(SUPABASE_INVOICE_BUCKET)}/${path}`;
}


function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({data:reader.result,name:file.name,type:file.type});
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function deleteRecord(
  menu,
  id
){

  menu =
    String(menu || "").trim();

  id =
    String(id || "").trim();

  if(!id){

    showToast(
      "ID data tidak ditemukan.",
      "error"
    );

    return;

  }


  if(
    !confirm(
      "Yakin ingin menghapus data ini?"
    )
  ){

    return;

  }


  let action = "";

  switch(menu){

    case "Event":
      action = "deleteEvent";
      break;

    case "Vendor":
      action = "deleteVendor";
      break;

    case "Perlengkapan":
      action = "deletePerlengkapan";
      break;

    case "Invoice":
      action = "deleteInvoice";
      break;

    case "Pembayaran":
      action = "deletePembayaran";
      break;

    case "Cashflow":
      action = "deleteCashflow";
      break;

    default:

      showToast(
        "Menu hapus tidak dikenali.",
        "error"
      );

      return;

  }


  setLoading(
    true,
    "Menghapus data..."
  );


  try{

    const result =
      await api(
        action,
        {
          userName:
            state.user.username,
          id
        }
      );

    if(!result.ok)
      throw new Error(
        result.message
      );

    showToast(
      result.message,
      "success"
    );

    applyMutationResult(
      action,
      result,
      {id}
    );

    const pages = {
      Event:"event",
      Vendor:"vendor",
      Perlengkapan:"perlengkapan",
      Invoice:"invoice",
      Pembayaran:"pembayaran",
      Cashflow:"cashflow"
    };

    navigate(
      pages[menu] ||
      "dashboard"
    );

  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }finally{

    setLoading(false);

  }

}

function renderPermissionRows(){

  const result =

  if(!result)
    return;

  const rows =

      .filter(
        row =>
          String(
            row.Role
          ).toLowerCase() !==
          "superadmin"
      );


  const body =

  index,
  action,
  checked
){

  return `
    <td style="text-align:center">

        type="checkbox"
        class="permission-check"
        data-index="${index}"
        data-action="${action}"
        ${
          Boolean(checked)
          ? "checked"
          : ""
        }
      >

    </td>
  `;

}


async function savePermissionData(){

  if(!state.permissionAdmin)
    return;


  const rows =
    (state.permissionAdmin.permissions || [])
      .filter(
        row =>
          String(
            row.Role
          ).toLowerCase() !==
          "superadmin"
      )
      .map(
        row=>({...row})
      );


  document.querySelectorAll(
    ".permission-check"
  ).forEach(input=>{

    const index =
      Number(
        input.dataset.index
      );

    const action =
      input.dataset.action;

    if(rows[index]){

      rows[index][action] =
        input.checked;

    }

  });


  setLoading(
    true,
    "Menyimpan hak akses..."
  );


  try{

    const result =
      await api(
        "savePermissions",
        {
          userName:
            state.user.username,
          permissions:rows
        }
      );

    if(!result.ok)
      throw new Error(
        result.message
      );

    showToast(
      result.message,
      "success"
    );

    navigate(
      "permissions"
    );
    refreshDataInBackground();

  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }finally{

    setLoading(false);

  }

}

  "changePasswordNav"
).addEventListener(
  "click",
  openChangePasswordModal
);


function openChangePasswordModal(){

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Ganti Password";


  document.getElementById(
    "modalBody"
  ).innerHTML = `

    <form id="changePasswordForm">

      <div class="form-group">

        <label class="form-label">
          Password Lama
        </label>

        <input
          id="oldPassword"
          type="password"
          class="form-control"
          required
        >

      </div>


      <div class="form-group">

        <label class="form-label">
          Password Baru
        </label>

        <input
          id="newPassword"
          type="password"
          class="form-control"
          required
        >

      </div>


      <div class="form-group">

        <label class="form-label">
          Konfirmasi Password Baru
        </label>

        <input
          id="confirmPassword"
          type="password"
          class="form-control"
          required
        >

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn btn-secondary"
          data-modal-close
        >
          Batal
        </button>

        <button
          type="submit"
          class="btn btn-primary"
        >
          Simpan Password
        </button>

      </div>

    </form>
  `;


  document.getElementById(
    "changePasswordForm"
  ).addEventListener(
    "submit",
    saveChangePassword
  );


  openModal();

}


async function saveChangePassword(e){

  e.preventDefault();

  const oldPassword =
    document.getElementById(
      "oldPassword"
    ).value;

  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;

  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;


  if(
    newPassword !==
    confirmPassword
  ){

    showToast(
      "Konfirmasi password tidak sama.",
      "error"
    );

    return;

  }


  setLoading(
    true,
    "Mengubah password..."
  );


  try{

    const result =
      await api(
        "changePassword",
        {
          username:
            state.user.username,
          oldPassword,
          newPassword
        }
      );

    if(!result.ok)
      throw new Error(
        result.message
      );

    closeModal();

    showToast(
      result.message,
      "success"
    );

  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }finally{

    setLoading(false);

  }

}


/* =====================================================
MODAL
===================================================== */

function openModal(){

  document.getElementById(
    "modal"
  ).classList.add("show");

}


function closeModal(){

  document.getElementById(
    "modal"
  ).classList.remove("show");

  document.getElementById(
    "modalBody"
  ).innerHTML = "";

  state.editId = null;

}


document.getElementById(
  "modalClose"
).addEventListener(
  "click",
  closeModal
);


document.getElementById(
  "modal"
).addEventListener(
  "click",
  function(e){

    if(e.target === this)
      closeModal();

  }
);


/* Tombol Batal modal yang dibuat dinamis */
document.addEventListener(

      )

    }

);


/* =====================================================
OPTION
===================================================== */

function option(
  value,
  current
){

  return `
    <option
      value="${escapeHtml(value)}"
      ${
        String(value) ===
        String(current || "")
        ? "selected"
        : ""
      }
    >
      ${escapeHtml(value)}
    </option>
  `;

}


/* =====================================================
EXPORT
===================================================== */

async function exportData(sheet){
  if(!can(sheet,"CanExport")){
    showToast("Anda tidak memiliki izin export.","error");
    return;
  }
  try{
    const rows=state.data[sheet] || await getAllRows(sheet);
    if(!rows.length){ showToast("Tidak ada data untuk diexport.","error"); return; }
    const headers=Array.from(new Set(rows.flatMap(r=>Object.keys(r))));
    const csv=[headers,...rows.map(r=>headers.map(h=>{
      let v=r[h];
      if(typeof v === "object" && v !== null) v=JSON.stringify(v);
      return `"${String(v??"").replace(/"/g,'""')}"`;
    }))].map(r=>r.join(",")).join("\r\n");
    const blob=new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`${sheet}_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }catch(error){ showToast(error.message||"Gagal export data.","error"); }
}

INIT
===================================================== */

async function init(){

  setProgress(0);

  const session =
    restoreSession();

  if(!session){

    document.getElementById(
      "loginPage"
    ).classList.remove(
      "hidden"
    );

    document.getElementById(
      "app"
    ).classList.add(
      "hidden"
    );

    return;

  }


  document.getElementById(
    "loginPage"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "app"
  ).classList.remove(
    "hidden"
  );


  updateUserUI();


  try{
    await loadData({
      useCache:true,
      silent:true
    });
    navigate("dashboard");
  }catch(error){
    console.error(error);
    navigate("dashboard");
  }

}


init();

    document.visibilityState === "visible" &&
    Date.now() - lastDataSyncAt > 45000
  ){
    refreshDataInBackground(true);
  }
},60000);
